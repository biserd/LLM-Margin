kind = "web"
previewPath = "/"
title = "TokenCalc"
version = "1.0.0"
id = "artifacts/tokencalc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25902

[services.development]
run = "pnpm --filter @workspace/tokencalc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tokencalc", "run", "build" ]
publicDir = "artifacts/tokencalc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/cost-per-user"
to = "/cost-per-user/index.html"

[[services.production.rewrites]]
from = "/budget-planner"
to = "/budget-planner/index.html"

[[services.production.rewrites]]
from = "/pricing"
to = "/pricing/index.html"

[[services.production.rewrites]]
from = "/terms"
to = "/terms/index.html"

[[services.production.rewrites]]
from = "/privacy"
to = "/privacy/index.html"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25902"
BASE_PATH = "/"
