kind = "web"
previewPath = "/"
title = "TokenCalc"
version = "1.0.0"
id = "artifacts/tokencalc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25902

[services.development]
run = "pnpm --filter @workspace/tokencalc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tokencalc", "run", "build" ]
publicDir = "artifacts/tokencalc/dist/public"
serve = "static"

